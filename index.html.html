<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CarLab — маршрут до сервісу</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d12; --panel:#12151c; --panel2:#181c25; --line:#2b2f3a;
    --gold:#f3c94f; --gold2:#c99a2e; --goldDim:#6e5a22; --ink:#ece8dc; --mute:#8d93a3;
    --road:#262d3c; --hwy:#36435f; --ease:cubic-bezier(.65,.05,.25,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;background:#06070a;color:var(--ink);
    font-family:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  .app{
    position:relative;max-width:460px;height:100dvh;margin:0 auto;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 12px);
    background:
      radial-gradient(120% 60% at 50% 0%, #1b1f2a 0%, transparent 60%),
      repeating-linear-gradient(100deg, rgba(255,255,255,.012) 0 2px, transparent 2px 5px),
      var(--bg);
    overflow:hidden;
  }
  /* ---------- header ---------- */
  .brand{display:flex;flex-direction:column;align-items:center;gap:0;margin-top:2px}
  .brand svg{width:150px;height:28px;display:block}
  .logo-img{display:block;height:58px;width:auto;max-width:80%;object-fit:contain;filter:drop-shadow(0 2px 10px rgba(243,201,79,.35))}
  .logo{font-family:'Russo One',Impact,sans-serif;font-size:36px;line-height:1;letter-spacing:.02em;
    transform:skewX(-8deg);margin-top:-6px;
    background:linear-gradient(180deg,#fff0a8 0%,#f3c94f 45%,#a97b14 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 6px rgba(243,201,79,.25))}
  .title{display:flex;align-items:center;gap:10px;margin:10px 0 10px;
    font-family:'Russo One',sans-serif;font-size:15px;letter-spacing:.08em;color:#e4e0d4}
  .title::before,.title::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold2))}
  .title::after{transform:scaleX(-1)}

  /* ---------- direction switch ---------- */
  .seg{position:relative;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;
    background:var(--panel);border:1px solid var(--goldDim);border-radius:14px}
  .seg .pill{position:absolute;top:3px;bottom:3px;left:3px;width:calc((100% - 6px)/3);border-radius:11px;
    background:linear-gradient(180deg,#f8d96a,#c99a2e);box-shadow:0 0 18px rgba(243,201,79,.35);
    transform:translateX(calc(var(--i,0)*100%));opacity:0;
    transition:transform .6s var(--ease),opacity .4s}
  .seg.on .pill{opacity:1}
  .seg button{position:relative;z-index:1;border:0;background:none;color:var(--ink);cursor:pointer;
    font:800 13px 'Manrope',sans-serif;padding:9px 4px;display:flex;align-items:center;justify-content:center;gap:6px;
    transition:color .4s}
  .seg button.active{color:#1a1405}
  .ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

  /* ---------- map ---------- */
  .mapwrap{position:relative;flex:1;min-height:0;margin:10px 0 0;border:1px solid var(--gold2);
    background:#0e1118;border-radius:6px;overflow:hidden;
    box-shadow:0 0 0 3px rgba(243,201,79,.05), inset 0 0 40px rgba(0,0,0,.5)}
  #map{touch-action:none;cursor:grab;position:absolute;inset:0;width:100%;height:100%;display:block}
  .ghost{fill:none;stroke:#7d6726;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;
    transition:stroke-dashoffset 1.6s var(--ease),opacity .7s}
  .ghost.dim{opacity:.0}
  #route{fill:none;stroke:url(#gold);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
  #trail{fill:none;stroke:#fff6cf;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
  .lbl{font:700 9px 'Manrope',sans-serif;fill:#8d93a3}
  .lbl.big{font-size:11px;fill:#cfd3de}
  .badge rect{fill:#c9534f;stroke:#f3d3d0;stroke-width:.6}
  .badge text{font:800 9px 'Manrope',sans-serif;fill:#fff;text-anchor:middle}
  .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}

  .chip{position:absolute;transform:translate(-50%,-50%);border:1px solid var(--gold);background:rgba(14,16,22,.92);
    color:var(--gold);font:800 12px 'Manrope',sans-serif;padding:7px 11px;border-radius:999px;cursor:pointer;
    display:flex;gap:6px;align-items:center;box-shadow:0 0 16px rgba(243,201,79,.25);
    transition:opacity .5s,transform .5s var(--ease)}
  .chip::after{content:"";position:absolute;inset:-5px;border-radius:999px;border:1px solid var(--gold);
    animation:ring 2s ease-out infinite}
  @keyframes ring{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.25);opacity:0}}
  .chip.hide{opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.6)}

  .bubble{position:absolute;left:0;top:0;z-index:5;max-width:210px;display:flex;align-items:center;gap:8px;
    background:rgba(12,14,19,.94);border:1px solid var(--gold);border-radius:12px;padding:7px 11px 7px 8px;
    font:800 12.5px/1.2 'Manrope',sans-serif;color:#fbe9a6;box-shadow:0 6px 22px rgba(0,0,0,.55),0 0 18px rgba(243,201,79,.25);
    opacity:0;pointer-events:none;
    transition:opacity .4s,transform .45s var(--ease)}
  .bubble.show{opacity:1}
  .bubble .bi{width:26px;height:26px;border-radius:50%;background:linear-gradient(180deg,#f8d96a,#c99a2e);color:#1a1405;
    display:grid;place-items:center;flex:none}
  .bubble .bi .ic{width:15px;height:15px;stroke-width:2.4}
  .bubble .bt{transition:opacity .25s}
  .bubble.swap .bt{opacity:0}
  .bubble::after{content:"";position:absolute;left:calc(50% + var(--tx,0px));width:10px;height:10px;background:#0c0e13;
    border:1px solid var(--gold);border-top:0;border-left:0;transform:translateX(-50%) rotate(45deg)}
  .bubble.up{transform:translate(-50%,calc(-100% - 22px))}
  .bubble.up::after{bottom:-6px}
  .bubble.down{transform:translate(-50%,22px)}
  .bubble.down::after{top:-6px;transform:translateX(-50%) rotate(225deg)}
  .zoom{position:absolute;left:8px;bottom:8px;z-index:6;display:flex;flex-direction:column;gap:6px}
  .zoom button{width:38px;height:38px;border-radius:11px;border:1px solid var(--goldDim);background:rgba(14,16,22,.92);color:var(--gold);
    display:grid;place-items:center;cursor:pointer;padding:0;transition:background .3s,color .3s,opacity .3s}
  .zoom button:disabled{opacity:.35;cursor:default}
  .zoom button.on{background:linear-gradient(180deg,#f8d96a,#c99a2e);color:#1a1405;border-color:transparent}
  .note{position:absolute;right:8px;bottom:6px;font:600 9.5px 'Manrope';color:#5d6373}

  /* ---------- sheet ---------- */
  .sheet{margin-top:10px;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:18px;padding:12px 12px 12px}
  .rail{position:relative;display:flex;justify-content:space-between;align-items:center;margin:2px 6px 12px;min-height:30px;
    transition:opacity .4s}
  .rail.off{opacity:0;pointer-events:none;height:0;min-height:0;margin:0}
  .rail .bar,.rail .fill{position:absolute;left:14px;right:14px;top:50%;height:2px;margin-top:-1px;background:var(--line);border-radius:2px}
  .rail .fill{background:linear-gradient(90deg,var(--gold2),var(--gold));right:auto;width:calc(100% - 28px);
    transform-origin:left;transform:scaleX(var(--p,0));transition:transform .9s var(--ease)}
  .node{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
    color:var(--mute);display:grid;place-items:center;cursor:pointer;padding:0;
    transition:transform .5s var(--ease),background .4s,color .4s,border-color .4s,box-shadow .4s}
  .node .ic{width:15px;height:15px}
  .node.done{border-color:var(--gold2);color:var(--gold)}
  .node.now{transform:scale(1.28);background:linear-gradient(180deg,#f8d96a,#c99a2e);color:#1a1405;border-color:transparent;
    box-shadow:0 0 16px rgba(243,201,79,.5)}
  .card{display:flex;gap:12px;align-items:flex-start;min-height:92px;transition:opacity .2s,transform .3s var(--ease)}
  .card.out{opacity:0;transform:translateY(8px)}
  .card .big{width:48px;height:48px;border-radius:14px;flex:none;display:grid;place-items:center;
    background:rgba(243,201,79,.1);border:1px solid var(--goldDim);color:var(--gold)}
  .card .big .ic{width:26px;height:26px}
  .card .meta{font:700 11.5px 'Manrope';color:var(--gold2);margin-bottom:2px}
  .card h2{margin:0 0 4px;font:400 19px/1.15 'Russo One',sans-serif;color:#f2eedf}
  .card p{margin:0;font:500 13.5px/1.4 'Manrope',sans-serif;color:#b9bdc9}
  .ctl{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:8px;margin-top:10px}
  .btn{height:46px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;
    font:800 13.5px 'Manrope',sans-serif;display:flex;align-items:center;justify-content:center;gap:6px;
    transition:transform .2s,opacity .3s,box-shadow .3s}
  .btn:active{transform:scale(.97)}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.gold{background:linear-gradient(180deg,#f8d96a,#c99a2e);border-color:transparent;color:#1a1405;box-shadow:0 0 18px rgba(243,201,79,.3)}
  .btn.rec{border-color:var(--gold2);color:var(--gold)}
  .btn.rec.on{background:rgba(243,201,79,.14)}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
  @media (max-height:700px){.logo-img{height:44px}.card{min-height:76px}.card p{font-size:12.5px}}
</style>
</head>

        <circle r="9" fill="#0a4fb0" stroke="#ffd800" stroke-width="2"/>
        <use href="#i-cart" x="-6" y="-6" width="12" height="12" stroke="#fff" fill="none" style="stroke-width:2.4"/>
      </g>
      <text x="106" y="454" class="lbl big" text-anchor="end">Lidl</text>

      <!-- service -->
      <g id="service" transform="translate(62 312)">
        <circle r="10" fill="none" stroke="#f3c94f" stroke-width="1.5" class="pulse"/>
        <path d="M0 0c0 0-15-14-15-27a15 15 0 0 1 30 0c0 13-15 27-15 27z" transform="translate(0 0)" fill="url(#gold)" stroke="#fff3bf" stroke-width="1"/>
        <circle cx="0" cy="-27" r="9" fill="#12151c"/>
        <use href="#i-garage" x="-6.5" y="-33.5" width="13" height="13" stroke="#f3c94f" fill="none" style="stroke-width:2.2"/>
        <text x="22" y="-24" fill="#f3c94f" style="font:800 12px 'Russo One',sans-serif">СЕРВІС</text>
        <text x="22" y="-10" fill="#f3c94f" style="font:800 12px 'Russo One',sans-serif">CARLAB</text>
      </g>

      <!-- car -->
      <g id="car" transform="translate(-50 -50)">
        <circle r="13" fill="rgba(243,201,79,.25)" class="pulse"/>
        <g transform="scale(1.05)">
          <rect x="-7" y="-12" width="14" height="24" rx="5" fill="url(#gold)" stroke="#fff3bf" stroke-width="1"/>
          <path d="M-5 -3L5 -3L4 -8L-4 -8z" fill="#10131a"/>
          <rect x="-5" y="5" width="10" height="3" rx="1" fill="#10131a"/>
          <circle cx="-4.5" cy="-11.5" r="1.3" fill="#fffbe0"/><circle cx="4.5" cy="-11.5" r="1.3" fill="#fffbe0"/>
        </g>
      </g>
    </svg>

    <div id="chips"></div>
    <div class="bubble up" id="bubble"><span class="bi"><svg class="ic"><use href="#i-nav"/></svg></span><span class="bt">Ви тут</span></div>
    <div class="zoom"><button id="zin" aria-label="Збільшити"><svg class="ic"><use href="#i-plus"/></svg></button><button id="zout" aria-label="Зменшити" disabled><svg class="ic"><use href="#i-minus"/></svg></button><button id="zloc" aria-label="Стежити за авто"><svg class="ic"><use href="#i-target"/></svg></button></div>
    <div class="note">схема, без масштабу</div>
  </div>

  <div class="sheet">
    <div class="rail off" id="rail"><div class="bar"></div><div class="fill" id="fill"></div></div>
    <div class="card" id="card">
      <div class="big"><svg class="ic"><use id="cardIcon" href="#i-nav"/></svg></div>
      <div>
        <div class="meta" id="cardMeta"> </div>
        <h2 id="cardTitle">Звідки ви їдете?</h2>
        <p id="cardText">Натисніть мітку на мапі або оберіть напрямок угорі — ми прокладемо шлях до сервісу.</p>
      </div>
    </div>
    <div class="ctl">
      <button class="btn" id="prev" disabled><svg class="ic"><use href="#i-prev"/></svg>Назад</button>
      <button class="btn rec" id="demo"><svg class="ic"><use id="demoIc" href="#i-play"/></svg><span id="demoTxt">Демо</span></button>
      <button class="btn gold" id="next" disabled><span id="nextTxt">Далі</span><svg class="ic"><use id="nextIc" href="#i-next"/></svg></button>
    </div>
  </div>
</div>

<script>
/* ============================================================
   ДАНІ. Координати — у системі схеми 400 x 620 (SVG viewBox).
   pt — точка кроку: скрипт сам знайде найближче місце на лінії.
   ============================================================ */
const FINAL = "L180 340L115 400L62 312";
const ROUTES = {
  north: {
    label: "З півночі", sub: "по S79 від аеропорту Chopin", chip: [255, 40],
    d: "M255 -10L283 88C266 110 232 116 232 142L242 200L250 270" + FINAL,
    steps: [
      { pt:[255,22],  icon:"nav",    b:"Ви тут",             t:"Ви їдете по S79 з півночі", s:"Рухайтесь на південь до розв’язки з S2. Сервіс розташований на захід від селища Dawidy." },
      { pt:[283,88],  icon:"exit",   b:"З’їзд до Dawidy",    t:"З’їзд біля розв’язки S2",   s:"На S2 не виїжджайте. Візьміть правий з’їзд і тримайтесь дороги в бік Giserska." },
      { pt:[240,195], icon:"up",     b:"Прямо",              t:"Прямо по Giserska",         s:"Продовжуйте прямо через Dawidy, нікуди не звертайте." },
      { pt:[250,270], icon:"right",  b:"Поворот праворуч",   t:"Праворуч — Posag 7 Panien", s:"Біля вказівника Posag 7 Panien поверніть праворуч на вузьку дорогу в бік ставків." },
      { pt:[115,400], icon:"cart",   b:"Орієнтир — Lidl",    t:"Магазин Lidl поруч",        s:"Біля магазину Lidl дорога повертає. Поверніть праворуч і їдьте вздовж ставків." },
      { pt:[62,312],  icon:"garage", b:"Заїзд у бокс",       t:"Сервіс CARLAB",             s:"Ви на місці. Заїжджайте на територію та прямуйте до боксу." }
    ]
  },
  west: {
    label: "З заходу", sub: "по S2 з боку Варшави", chip: [52, 160],
    d: "M-10 170C70 162 150 130 296 101L338 182L371 300L380 420L376 486Q372 522 330 526L292 524L286 430L262 334L250 270" + FINAL,
    steps: [
      { pt:[30,166],  icon:"nav",    b:"Ви тут",             t:"Ви їдете по S2 на схід",    s:"Рухайтесь по S2 до розв’язки з S79." },
      { pt:[296,101], icon:"up",     b:"Не з’їжджайте",      t:"Розв’язка S2 / S79",        s:"Тримайтесь правіше та продовжуйте рух на південь по S79." },
      { pt:[376,480], icon:"exit",   b:"З’їзд",              t:"З’їзд на Dawidy Bankowe",   s:"Стежте за вказівниками Dawidy Bankowe і з’їжджайте з траси." },
      { pt:[292,524], icon:"right",  b:"Поворот праворуч",   t:"Праворуч — на північ",      s:"Поверніть праворуч і їдьте на північ дорогою до Dawidy." },
      { pt:[250,270], icon:"left",   b:"Поворот ліворуч",    t:"Ліворуч — Posag 7 Panien",  s:"Біля вказівника Posag 7 Panien поверніть ліворуч на вузьку дорогу до ставків." },
      { pt:[115,400], icon:"cart",   b:"Орієнтир — Lidl",    t:"Магазин Lidl поруч",        s:"Біля магазину Lidl поверніть праворуч і їдьте вздовж ставків." },
      { pt:[62,312],  icon:"garage", b:"Заїзд у бокс",       t:"Сервіс CARLAB",             s:"Ви на місці. Заїжджайте на територію та прямуйте до боксу." }
    ]
  },
  south: {
    label: "З півдня", sub: "по вул. Baletowa від Mysiadło", chip: [292, 588],
    d: "M292 640L292 524L286 430L262 334L250 270" + FINAL,
    steps: [
      { pt:[292,606], icon:"nav",    b:"Ви тут",             t:"Ви їдете по Baletowa",      s:"Рухайтесь на північ з боку Mysiadło та Nowa Iwiczna." },
      { pt:[288,470], icon:"up",     b:"Прямо",              t:"Прямо на північ",           s:"Продовжуйте дорогою на північ до селища Dawidy." },
      { pt:[250,270], icon:"left",   b:"Поворот ліворуч",    t:"Ліворуч — Posag 7 Panien",  s:"Біля вказівника Posag 7 Panien поверніть ліворуч на вузьку дорогу до ставків." },
      { pt:[115,400], icon:"cart",   b:"Орієнтир — Lidl",    t:"Магазин Lidl поруч",        s:"Біля магазину Lidl поверніть праворуч і їдьте вздовж ставків." },
      { pt:[62,312],  icon:"garage", b:"Заїзд у бокс",       t:"Сервіс CARLAB",             s:"Ви на місці. Заїжджайте на територію та прямуйте до боксу." }
    ]
  }
};
const KEYS = Object.keys(ROUTES);

/* ============================================================ */
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const svg = $("#map"), wrap = $("#mapwrap"), route = $("#route"), trail = $("#trail"), car = $("#car");
const bubble = $("#bubble"), chipsBox = $("#chips"), ghosts = $("#ghosts");
const seg = $("#seg"), rail = $("#rail"), fill = $("#fill"), card = $("#card");
const prevB = $("#prev"), nextB = $("#next"), demoB = $("#demo");
const zin = $("#zin"), zout = $("#zout"), zloc = $("#zloc");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const K = reduce ? 0.3 : 1;
const MAPW = 400, MAPH = 620, ZMAX = 5;

let cur = null, idx = 0, L = 0, carLen = 0, stepLen = [], carAnim = null, drawAnim = null, zAnim = null;
let demoOn = false, demoRun = 0;
let z = 1, cx = MAPW / 2, cy = MAPH / 2, follow = true, carPt = { x: -50, y: -50 };

const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const sleep = ms => new Promise(r => setTimeout(r, ms * K));

function tween(dur, fn) {
  let stop = false, done;
  const p = new Promise(r => done = r);
  const t0 = performance.now();
  (function frame(now) {
    if (stop) return done();
    const t = clamp((now - t0) / (dur * K), 0, 1);
    fn(ease(t));
    if (t < 1) requestAnimationFrame(frame); else done();
  })(t0);
  return { promise: p, cancel() { stop = true; done(); } };
}

/* ---------- камера: масштаб і зсув карти (viewBox) ---------- */
function view() {
  const r = svg.getBoundingClientRect();
  const w = MAPW / z, h = MAPH / z;
  const s = Math.min(r.width / w, r.height / h);
  return { w, h, s, x: cx - w/2, y: cy - h/2, ox: (r.width - w*s)/2, oy: (r.height - h*s)/2 };
}
function px(x, y) { const v = view(); return [v.ox + (x - v.x) * v.s, v.oy + (y - v.y) * v.s]; }
function toSvg(fx, fy) { const v = view(); return [v.x + (fx - v.ox) / v.s, v.y + (fy - v.oy) / v.s]; }
function applyView() {
  const w = MAPW / z, h = MAPH / z;
  cx = clamp(cx, w/2, MAPW - w/2); cy = clamp(cy, h/2, MAPH - h/2);
  const v = view();
  svg.setAttribute("viewBox", `${v.x} ${v.y} ${v.w} ${v.h}`);
  placeChips(); placeBubble();
  zin.disabled = z >= ZMAX - 0.01; zout.disabled = z <= 1.01;
  zloc.classList.toggle("on", follow && z > 1.01);
}
function setZoom(nz, fx, fy) {
  nz = clamp(nz, 1, ZMAX);
  const before = (!follow && fx != null) ? toSvg(fx, fy) : null;
  z = nz;
  if (before) { const a = toSvg(fx, fy); cx += before[0] - a[0]; cy += before[1] - a[1]; }
  applyView();
}
function animZoom(target) {
  target = clamp(target, 1, ZMAX);
  if (zAnim) zAnim.cancel();
  const from = z, r = wrap.getBoundingClientRect();
  zAnim = tween(450, p => setZoom(from + (target - from) * p, r.width / 2, r.height / 2));
}
// камера плавно їде за машинкою, коли карта збільшена
(function camLoop() {
  if (follow && z > 1.001) {
    const dx = carPt.x - cx, dy = carPt.y - cy;
    if (Math.abs(dx) > .05 || Math.abs(dy) > .05) { cx += dx * .14; cy += dy * .14; applyView(); }
  }
  requestAnimationFrame(camLoop);
})();

zin.onclick  = () => animZoom(z * 1.6);
zout.onclick = () => animZoom(z / 1.6);
zloc.onclick = () => { follow = true; animZoom(cur ? Math.max(z, 2.4) : 1); applyView(); };
svg.addEventListener("wheel", e => {
  e.preventDefault();
  if (zAnim) zAnim.cancel();
  const r = wrap.getBoundingClientRect();
  setZoom(z * Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

const ptrs = new Map(); let lastDist = 0;
const pdist = () => { const [a, b] = [...ptrs.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
svg.addEventListener("pointerdown", e => {
  svg.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) lastDist = pdist();
});
svg.addEventListener("pointermove", e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1 && z > 1.01) {
    const v = view(); cx -= dx / v.s; cy -= dy / v.s; follow = false; applyView();
  } else if (ptrs.size === 2) {
    if (zAnim) zAnim.cancel();
    const d = pdist(), r = wrap.getBoundingClientRect(), [a, b] = [...ptrs.values()];
    if (lastDist) setZoom(z * d / lastDist, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
    lastDist = d;
  }
});
const endPtr = e => { ptrs.delete(e.pointerId); lastDist = 0; };
svg.addEventListener("pointerup", endPtr);
svg.addEventListener("pointercancel", endPtr);

/* ---------- геометрія лінії ---------- */
function nearestLen(path, pt, from) {
  const total = path.getTotalLength();
  let best = from, bd = 1e9;
  for (let l = from; l <= total; l += 1.5) {
    const p = path.getPointAtLength(l);
    const d = (p.x-pt[0])**2 + (p.y-pt[1])**2;
    if (d < bd) { bd = d; best = l; }
  }
  return best;
}

/* ---------- машинка + підказка ---------- */
function setCar(len) {
  carLen = len;
  const p = route.getPointAtLength(len);
  const a = route.getPointAtLength(Math.max(0, len - 2));
  const b = route.getPointAtLength(Math.min(L, len + 2));
  const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI + 90;
  car.setAttribute("transform", `translate(${p.x} ${p.y}) rotate(${ang})`);
  trail.style.strokeDashoffset = L - len;
  carPt = { x: p.x, y: p.y };
  placeBubble();
}
function placeBubble() {
  const [X, Y] = px(carPt.x, carPt.y);
  const W = wrap.clientWidth, H = wrap.clientHeight, half = bubble.offsetWidth / 2;
  const out = X < -24 || X > W + 24 || Y < -24 || Y > H + 24;
  bubble.style.visibility = out ? "hidden" : "";
  const left = clamp(X, half + 8, W - half - 8);
  bubble.style.left = left + "px";
  bubble.style.top = clamp(Y, 0, H) + "px";
  bubble.style.setProperty("--tx", clamp(X - left, -half + 14, half - 14) + "px");
  const down = Y < 110;
  bubble.classList.toggle("down", down);
  bubble.classList.toggle("up", !down);
}
function setBubble(step, instant) {
  const apply = () => {
    bubble.querySelector(".bt").textContent = step.b;
    bubble.querySelector("use").setAttribute("href", "#i-" + step.icon);
    bubble.classList.remove("swap");
  };
  bubble.classList.add("show");
  if (instant) return apply();
  bubble.classList.add("swap");
  setTimeout(apply, 220 * K);
}

/* ---------- картка і шкала кроків ---------- */
function renderRail() {
  rail.querySelectorAll(".node").forEach(n => n.remove());
  ROUTES[cur].steps.forEach((s, i) => {
    const n = document.createElement("button");
    n.className = "node"; n.setAttribute("aria-label", s.t);
    n.innerHTML = `<svg class="ic"><use href="#i-${s.icon}"/></svg>`;
    n.onclick = () => { stopDemo(); go(i); };
    rail.appendChild(n);
  });
  rail.classList.remove("off");
}
function updateRail() {
  const n = ROUTES[cur].steps.length;
  rail.querySelectorAll(".node").forEach((el, i) => {
    el.classList.toggle("now", i === idx);
    el.classList.toggle("done", i < idx);
  });
  fill.style.setProperty("--p", idx / (n - 1));
  prevB.disabled = idx === 0;
  nextB.disabled = false;
  const last = idx === n - 1;
  $("#nextTxt").textContent = last ? "Знову" : "Далі";
  $("#nextIc").setAttribute("href", last ? "#i-redo" : "#i-next");
}
function renderCard(i, instant) {
  const R = ROUTES[cur], s = R.steps[i];
  const apply = () => {
    $("#cardIcon").setAttribute("href", "#i-" + s.icon);
    $("#cardMeta").textContent = `${R.label} · крок ${i + 1} з ${R.steps.length}`;
    $("#cardTitle").textContent = s.t;
    $("#cardText").textContent = s.s;
    card.classList.remove("out");
  };
  if (instant) return apply();
  card.classList.add("out");
  setTimeout(apply, 200 * K);
}

/* ---------- вибір напрямку ---------- */
async function select(key, force) {
  if (key === cur && !force) return;
  stopCar();
  cur = key; follow = true;
  const R = ROUTES[key];
  route.setAttribute("d", R.d); trail.setAttribute("d", R.d);
  L = route.getTotalLength();
  route.style.strokeDasharray = L; trail.style.strokeDasharray = L;
  route.style.strokeDashoffset = L; trail.style.strokeDashoffset = L;

  let from = 0;
  stepLen = R.steps.map(s => (from = nearestLen(route, s.pt, from)));

  seg.classList.add("on");
  seg.style.setProperty("--i", KEYS.indexOf(key));
  seg.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.key === key));
  KEYS.forEach(k => { $("#g-" + k).classList.add("dim"); });
  chipsBox.querySelectorAll(".chip").forEach(c => c.classList.add("hide"));

  idx = 0;
  renderRail(); updateRail(); renderCard(0, true);
  setCar(stepLen[0]); setBubble(R.steps[0], true);
  prevB.disabled = true; nextB.disabled = false;

  if (drawAnim) drawAnim.cancel();
  drawAnim = tween(1700, p => { route.style.strokeDashoffset = L * (1 - p); });
  await drawAnim.promise;
}

/* ---------- рух по кроках ---------- */
function stopCar() { if (carAnim) { carAnim.cancel(); carAnim = null; } }
async function go(i) {
  if (!cur) return;
  const R = ROUTES[cur];
  i = clamp(i, 0, R.steps.length - 1);
  idx = i; follow = true;
  updateRail(); renderCard(i); setBubble(R.steps[i]);
  stopCar();
  const from = carLen, to = stepLen[i];
  const dur = clamp(Math.abs(to - from) * 8, 800, 2400);
  carAnim = tween(dur, p => setCar(from + (to - from) * p));
  await carAnim.promise;
}
function next() { if (!cur) return; idx === ROUTES[cur].steps.length - 1 ? go(0) : go(idx + 1); }
function prev() { if (cur) go(idx - 1); }

/* ---------- режим «Демо» для запису екрана ---------- */
function stopDemo() {
  demoOn = false; demoRun++;
  demoB.classList.remove("on");
  $("#demoIc").setAttribute("href", "#i-play"); $("#demoTxt").textContent = "Демо";
}
async function demo() {
  if (demoOn) return stopDemo();
  demoOn = true; const run = ++demoRun;
  demoB.classList.add("on");
  $("#demoIc").setAttribute("href", "#i-stop"); $("#demoTxt").textContent = "Стоп";
  const alive = () => demoOn && run === demoRun;
  let k = cur ? KEYS.indexOf(cur) : 0;
  while (alive()) {
    await select(KEYS[k], true);          if (!alive()) break;
    await sleep(1800);
    const n = ROUTES[KEYS[k]].steps.length;
    for (let i = 1; i < n && alive(); i++) { await go(i); if (!alive()) break; await sleep(2200); }
    if (!alive()) break;
    await sleep(1500);
    k = (k + 1) % KEYS.length;
  }
}

/* ---------- старт ---------- */
function build() {
  KEYS.forEach((k, n) => {
    const g = document.createElementNS(NS, "path");
    g.setAttribute("d", ROUTES[k].d); g.setAttribute("class", "ghost"); g.id = "g-" + k;
    ghosts.appendChild(g);
    const len = g.getTotalLength();
    g.style.strokeDasharray = len; g.style.strokeDashoffset = len;
    g.style.transitionDelay = (n * 0.45) + "s";
    requestAnimationFrame(() => requestAnimationFrame(() => g.style.strokeDashoffset = 0));

    const c = document.createElement("button");
    c.className = "chip"; c.dataset.key = k;
    c.innerHTML = `<svg class="ic" style="width:15px;height:15px"><use href="#i-${k}"/></svg>${ROUTES[k].label}`;
    c.onclick = () => { stopDemo(); select(k); };
    chipsBox.appendChild(c);
  });
  seg.querySelectorAll("button").forEach(b => b.onclick = () => { stopDemo(); select(b.dataset.key); });
  applyView();
}
function placeChips() {
  KEYS.forEach(k => {
    const c = chipsBox.querySelector(`[data-key=${k}]`); if (!c) return;
    const [x, y] = px(...ROUTES[k].chip);
    c.style.left = x + "px"; c.style.top = y + "px";
  });
}
prevB.onclick = () => { stopDemo(); prev(); };
nextB.onclick = () => { stopDemo(); next(); };
demoB.onclick = demo;
addEventListener("resize", applyView);
addEventListener("keydown", e => {
  if (e.key === "ArrowRight") { stopDemo(); next(); }
  if (e.key === "ArrowLeft")  { stopDemo(); prev(); }
  if (e.key === "+" || e.key === "=") animZoom(z * 1.6);
  if (e.key === "-") animZoom(z / 1.6);
  if (e.key === " " && e.target === document.body) { e.preventDefault(); demo(); }
});
document.fonts && document.fonts.ready.then(applyView);
build();
</script>
</body>
</html>
